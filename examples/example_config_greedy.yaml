image4d: /path/to/4d_image.tif
output: /path/to/output_directory
log_level: INFO
lowres_factor: 0.5
dilation_radius: 2
registration_backend: greedy
minimum_required_vram_gb: 10
propagation_strategy_combo: sequential_star # options: sequential_star, sasd_star
# If > 0, crop the high-res images/masks/seg to the union bbox of the
# propagated low-res masks (padded by this many voxels) before running the
# high-res registration, then uncrop the resliced segmentation back to the
# reference frame. Speeds up registration on large volumes with localised
# segmentations. Disabled (0) by default; only effective when
# propagation_strategy_combo is sequential_star or sasd_star.
roi_crop_padding_voxels: 0
registration_backend_options:
  metric: SSD
  affine_dof: 6
  threads: 1
  smooth_sigma_pre_mm: 3.0
  smooth_sigma_post_mm: 1.5
  affine_iterations: [100, 50]
  deformable_iterations: [100, 25, 10]
  use_float: true  # pass -float to greedy for single-precision computation (default: true)
  label_interpolation: "0.2vox"  # smoothing for LABEL reslice; accepts "0.2vox" or "0.5mm" (default: 0.2vox)
cyclic_time: false
# Treat the timepoint axis as a closed loop, so a propagation chain may run off
# the end of the series and continue at timepoint 1 (and vice versa). Needed
# when a tp_input_group owns frames on both sides of the wrap -- e.g. a gated
# cardiac series where ref 8 owns ... 19, 20, 1, 2. Without it those wrapped
# frames are reached by one large jump backwards across frames owned by another
# group, which propagates badly. Only meaningful for genuinely cyclic
# acquisitions, so it is off by default.
debug: false
debug_dir: /path/to/debug_output
tp_input_groups:
  - tp_ref: 1
    tp_targets: [2, 3, 4]
    seg_ref: /path/to/seg_ref_tp1.tif
    additional_meshes:
      mesh1: /path/to/mesh1_tp1.obj
      mesh2: /path/to/mesh2_tp1.obj
  - tp_ref: 5
    tp_targets: [6, 7, 8]
    seg_ref: /path/to/seg_ref_tp5.tif
    additional_meshes:
      mesh1: /path/to/mesh1_tp5.obj
